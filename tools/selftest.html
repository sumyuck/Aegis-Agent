<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aegis-Agent self-test</title>
<style>
  :root { --bg:#f1f9ff; --panel:#fff; --panel-blue:#f7fcff; --line:#cfe2f0; --fg:#163b57;
          --dim:#547691; --muted:#7c9bb0; --accent:#65afe2; --mint:#248b78; --rose:#b65d6e; --sky:#3f93c9;
          --mono:ui-monospace,SFMono-Regular,Menlo,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(180deg,#f9fdff,#eef8ff); color:var(--fg); font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:min(1400px,100%); margin:auto; padding:28px 24px 44px; }
  h1 { font-size:22px; margin:0 0 5px; font-weight:750; letter-spacing:-.3px; } h1 span { color:var(--sky); }
  .lede { color:var(--dim); font-size:13px; max-width:700px; margin:0 0 20px; }
  .bar { display:flex; gap:11px; align-items:center; flex-wrap:wrap; margin-bottom:17px; background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:15px; padding:13px 15px; box-shadow:0 8px 22px rgba(57,117,155,.07); }
  button { font:inherit; font-size:13px; padding:9px 15px; border-radius:9px; cursor:pointer; background:linear-gradient(135deg,#b9e1f9,#7fc0e9); border:1px solid #85c3e9; color:#163b57; font-weight:700; }
  button.sec { background:var(--panel-blue); border-color:var(--line); color:var(--dim); }
  label { font-size:12px; color:var(--dim); display:flex; gap:7px; align-items:center; font-weight:600; }
  input[type=range] { accent-color:var(--accent); }
  select { background:#fff; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12px; }
  .verdict { font:12px/1.6 var(--mono); padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:#f9fcff; color:var(--dim); margin-bottom:17px; white-space:pre-wrap; }
  .verdict.ok { color:#16715f; background:#e4f7f1; border-color:#a8dbcd; }.verdict.bad { color:#a4475c; background:#fff0f3; border-color:#efc1ca; }
  .cols { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }.col { min-width:0; }.col h3 { color:var(--dim); margin:0 0 8px; font-size:13px; font-weight:700; }
  .col canvas, .preview { width:100%; border:1px solid var(--line); border-radius:12px; display:block; background:#f7fcff; }
  .preview { position:relative; min-height:220px; aspect-ratio:900 / 560; overflow:hidden; display:grid; place-items:center; color:var(--muted); font-size:12px; }
  .preview img { width:100%; height:100%; object-fit:contain; }.preview img[hidden], .preview span[hidden] { display:none; }
  pre { font:10.5px/1.5 var(--mono); background:#fbfdff; border:1px solid var(--line); border-radius:12px; padding:11px; overflow:auto; max-height:320px; color:#3d6685; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:18px; }.grid2 > div { padding:14px; background:rgba(255,255,255,.84); border:1px solid var(--line); border-radius:14px; }
  table { width:100%; border-collapse:collapse; font:11px var(--mono); } th { text-align:left; color:var(--muted); border-bottom:1px solid var(--line); padding:7px 6px; font:700 10px -apple-system,sans-serif; } td { padding:7px 6px; border-bottom:1px solid #e6f0f7; }
  .m { display:grid; grid-template-columns:repeat(6,1fr); gap:9px; margin-top:16px; }.m div { background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:11px; padding:8px 10px; }.m .k { font:10px -apple-system,sans-serif; color:var(--muted); }.m .v { font:13px var(--mono); }
  @media (max-width:900px) { .cols,.grid2 { grid-template-columns:1fr; }.m { grid-template-columns:repeat(3,1fr); } main { padding:20px 14px 30px; } }
</style>
<body>
<main>
<h1>Aegis-Agent <span>self-test</span></h1>
<p class="lede">Run the complete local perception and redaction pipeline on a synthetic frame.</p>

<div class="bar">
  <button id="run">Run self-test</button>
  <button id="rerender" class="sec">New synthetic frame</button>
  <label>Lens B sensitivity <input id="thr" type="range" min="0.5" max="2.2" step="0.05" value="1.05">
    <span id="thrV" style="font:11px var(--mono)">1.05</span></label>
  <label>Tile <select id="tile"><option>4</option><option selected>8</option><option>16</option></select></label>
  <label>Backend <select id="be"><option value="webgpu" selected>WebGPU</option><option value="cpu">CPU fallback</option></select></label>
  <label>Mode <select id="mode">
    <option value="balanced" selected>balanced</option>
    <option value="paranoid">paranoid</option>
    <option value="dom-only">dom-only</option></select></label>
</div>

<div id="verdict" class="verdict">Press <b>Run self-test</b>.</div>

<div class="cols">
  <div class="col"><h3>Source frame</h3><canvas id="src" width="900" height="560"></canvas></div>
  <div class="col"><h3>Lens B map</h3><div class="preview"><img id="heat" alt="heatmap" hidden><span id="heatEmpty">Run the test to view</span></div></div>
  <div class="col"><h3>Protected output</h3><div class="preview"><img id="out" alt="sanitised" hidden><span id="outEmpty">Run the test to view</span></div></div>
</div>

<div class="m" id="metrics"></div>

<div class="grid2">
  <div><h3 style="margin:0 0 10px;font-size:13px">Masks and proof</h3>
    <table id="tbl"><thead><tr><th>Token</th><th>Lens</th><th>Box</th><th>Px</th><th>Uniform</th><th>Colours</th></tr></thead><tbody></tbody></table></div>
  <div><h3 style="margin:0 0 10px;font-size:13px">Attestation</h3>
    <pre id="json">No result yet</pre></div>
</div>
</main>

<script type="module">
import { sanitize } from '/extension/offscreen/redactor.js';

const $ = (id) => document.getElementById(id);
const src = $('src');

/* A synthetic dashboard: text lines at several sizes (should be detected), a solid
   logo block and a photographic gradient (should NOT be detected). */
function render() {
  const g = src.getContext('2d');
  const W = src.width, H = src.height;
  g.fillStyle = '#f7fcff'; g.fillRect(0, 0, W, H);

  // photographic region — a smooth gradient plus noise: high variance, low crossings
  const grad = g.createLinearGradient(520, 40, 880, 260);
  grad.addColorStop(0, '#8fc7e6'); grad.addColorStop(.5, '#d6b9a2'); grad.addColorStop(1, '#a9bde1');
  g.fillStyle = grad; g.fillRect(520, 40, 350, 220);
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = `rgba(255,255,255,${Math.random() * 0.12})`;
    g.fillRect(520 + Math.random() * 350, 40 + Math.random() * 220, 2, 2);
  }

  // solid logo block — high contrast, no crossings
  g.fillStyle = '#65afe2'; g.fillRect(40, 30, 54, 54);
  g.fillStyle = '#f7fcff'; g.fillRect(54, 44, 26, 26);

  const lines = [
    ['600 22px ui-monospace, monospace', '#163b57', 'MISSION OPS / RESTRICTED', 40, 130],
    ['15px ui-monospace, monospace', '#163b57', 'Holder    : Ananya Verma', 40, 176],
    ['15px ui-monospace, monospace', '#163b57', 'Aadhaar   : 7856 2341 9086', 40, 204],
    ['15px ui-monospace, monospace', '#163b57', 'Pad coords: 13.7199 N, 80.2304 E', 40, 232],
    ['15px ui-monospace, monospace', '#163b57', 'Card      : 5425 2334 3010 9903', 40, 260],
    ['12px ui-monospace, monospace', '#668aa5', 'clearance L3, bay 2, issued 14/03/2026', 40, 292],
    ['600 17px ui-monospace, monospace', '#163b57', 'Beneficiary: R. Krishnan / HDFC0001742', 40, 340],
    ['11px ui-monospace, monospace', '#7c9bb0', 'small print: eight point text is the hard case for tile detectors', 40, 372]
  ];
  for (const [font, fill, text, x, y] of lines) { g.font = font; g.fillStyle = fill; g.fillText(text, x, y); }

  // a table-ish block of numbers — dense text
  g.font = '12px ui-monospace, monospace';
  for (let r = 0; r < 6; r++) {
    for (let c = 0; c < 5; c++) {
      g.fillStyle = r % 2 ? '#668aa5' : '#94bdd8';
      g.fillText(String(100000 + Math.floor(Math.random() * 899999)), 520 + c * 70, 320 + r * 22);
    }
  }
  // a DOM-known field, to exercise Lens A fusion
  g.strokeStyle = '#cfe2f0'; g.strokeRect(40, 420, 300, 34);
  g.fillStyle = '#163b57'; g.font = '14px ui-monospace, monospace';
  g.fillText('••••••••••••••••', 50, 442);
  g.fillStyle = '#7c9bb0'; g.font = '11px ui-monospace, monospace';
  g.fillText('password (reported by Lens A, not by the GPU)', 40, 472);
}

function canvasToDataUrl() { return src.toDataURL('image/png'); }

async function run() {
  $('run').disabled = true;
  $('verdict').className = 'verdict';
  $('verdict').textContent = 'running…';
  try {
    const frame = canvasToDataUrl();
    const result = await sanitize({
      frame,
      // Lens A's contribution: the password box it found via attributes.
      domRegions: [{
        source: 'dom-field', ruleId: 'password', token: '[MASK_PASSWORD]', severity: 3,
        label: 'Password field', box: { x: 40, y: 420, w: 300, h: 34 }, confidence: 1
      }],
      // Whole frame declared a pixel surface, so Lens B candidates are kept.
      visualSurfaces: [{ kind: 'canvas', box: { x: 0, y: 0, w: src.width, h: src.height } }],
      viewport: { w: src.width, h: src.height, dpr: 1 },
      dpr: 1,
      options: {
        useGpu: $('be').value === 'webgpu',
        mode: $('mode').value,
        threshold: parseFloat($('thr').value),
        tile: parseInt($('tile').value, 10),
        quality: 0.72,
        wantTileMap: true
      }
    });

    $('out').src = URL.createObjectURL(result.sanitizedBlob);
    $('out').hidden = false;
    $('outEmpty').hidden = true;
    if (result.heatmapBlob) {
      $('heat').src = URL.createObjectURL(result.heatmapBlob);
      $('heat').hidden = false;
      $('heatEmpty').hidden = true;
    }

    // ---- assertions ----
    const A = [];
    const gpuRegions = result.regions.filter((r) => r.source === 'gpu-visual');
    const domRegions = result.regions.filter((r) => r.source !== 'gpu-visual');
    A.push(['enclave produced a webp buffer', result.sanitizedBlob.type === 'image/webp']);
    A.push(['every mask verified pixel-uniform', result.verification.allUniform]);
    A.push(['attestation carries both hashes',
            !!result.attestation.rawSha256 && !!result.attestation.sanitizedSha256]);
    A.push(['hashes differ (output is not the input)',
            result.attestation.rawSha256 !== result.attestation.sanitizedSha256]);
    A.push(['Lens A region preserved', domRegions.length === 1]);
    A.push([`Lens B found text regions (${gpuRegions.length})`,
            $('mode').value === 'dom-only' ? gpuRegions.length === 0 : gpuRegions.length >= 4]);
    A.push(['logo block not masked', !gpuRegions.some((r) =>
            r.box.x < 100 && r.box.y < 95 && r.box.y + r.box.h > 30 && r.box.w < 80)]);
    A.push(['output smaller than input', result.attestation.sanitizedBytes < result.attestation.rawBytes]);

    const failed = A.filter(([, ok]) => !ok);
    $('verdict').className = `verdict ${failed.length ? 'bad' : 'ok'}`;
    $('verdict').textContent =
      `${failed.length ? '✗ ' + failed.length + ' assertion(s) failed' : '✓ all ' + A.length + ' assertions passed'}\n` +
      `backend: ${result.vision.backend}${result.vision.adapter ? ', ' + (result.vision.adapter.vendor || '') + ' ' + (result.vision.adapter.architecture || '') : ''}` +
      `, ${result.vision.cells} tiles, ${result.vision.candidates} candidates, ${result.regions.length} masks\n` +
      A.map(([n, ok]) => `  ${ok ? '✓' : '✗'} ${n}`).join('\n');

    const m = result.metrics;
    $('metrics').innerHTML = [
      ['decode', m.decodeMs + ' ms'], ['gpu pass', m.gpuMs + ' ms'], ['group', m.groupMs + ' ms'],
      ['mask', m.maskMs + ' ms'], ['verify', m.verifyMs + ' ms'], ['encode', m.encodeMs + ' ms'],
      ['total', m.totalMs + ' ms'], ['frame', m.imageW + '×' + m.imageH],
      ['raw', Math.round(result.attestation.rawBytes / 1024) + ' KB'],
      ['wire', Math.round(result.attestation.sanitizedBytes / 1024) + ' KB'],
      ['ratio', m.compressionRatio + '×'], ['masks', result.regions.length]
    ].map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

    const tb = $('tbl').querySelector('tbody');
    tb.innerHTML = result.regions.map((r, i) => {
      const p = result.verification.proofs[i];
      return `<tr><td style="color:#3f93c9">${r.token}</td><td>${r.source}</td>` +
        `<td>${r.box.x},${r.box.y} ${r.box.w}×${r.box.h}</td><td>${p.pixels}</td>` +
        `<td style="color:${p.uniform ? '#248b78' : '#b65d6e'}">${p.uniform ? 'yes, 0 bits' : 'NO'}</td>` +
        `<td>${p.distinctColours}</td></tr>`;
    }).join('');

    $('json').textContent = JSON.stringify({
      attestation: result.attestation,
      vision: result.vision,
      metrics: result.metrics,
      assertions: Object.fromEntries(A)
    }, null, 2);
  } catch (e) {
    $('verdict').className = 'verdict bad';
    $('verdict').textContent = `pipeline threw:\n${e && e.stack || e}`;
    console.error(e);
  } finally {
    $('run').disabled = false;
  }
}

$('thr').addEventListener('input', () => { $('thrV').textContent = parseFloat($('thr').value).toFixed(2); });
$('run').addEventListener('click', run);
$('rerender').addEventListener('click', () => { render(); $('verdict').textContent = 'New frame rendered. Run again.'; });
render();
</script>
</body>
</html>
