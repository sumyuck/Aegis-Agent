<!doctype html>
<meta charset="utf-8">
<title>Aegis-Agent</title>
<link rel="stylesheet" href="popup.css">
<body>
<header>
  <div class="brand">
    <span class="shield">◈</span>
    <div>
      <div class="title">Aegis&#8209;Agent</div>
      <div class="sub">on&#8209;device visual perception · zero&#8209;trust egress</div>
    </div>
  </div>
  <div class="badges">
    <span id="gpuBadge" class="badge">backend …</span>
    <span id="srvBadge" class="badge">server …</span>
  </div>
</header>

<section class="control">
  <input id="goal" type="text" placeholder="Agent goal — e.g. “open the Payments tab and start a new transfer”" autocomplete="off">
  <div class="row">
    <button id="dryRun" class="primary">Perceive &amp; Redact <span class="hint">(no network)</span></button>
    <button id="run">Run agent</button>
    <button id="stop" class="ghost" disabled>Stop</button>
  </div>
</section>

<nav class="tabs">
  <button class="tab active" data-tab="evidence">Evidence</button>
  <button class="tab" data-tab="masks">Masks <span id="maskCount" class="pill">0</span></button>
  <button class="tab" data-tab="wire">On the wire</button>
  <button class="tab" data-tab="settings">Settings</button>
</nav>

<main>
  <!-- ------------------------------------------------------------ evidence -->
  <div class="panel active" id="panel-evidence">
    <div id="verdict" class="verdict idle">No frame processed yet.</div>

    <div class="viewToggle">
      <button class="seg active" data-view="sanitized">What the server sees</button>
      <button class="seg" data-view="heatmap">GPU textness heatmap</button>
    </div>
    <div class="stage">
      <img id="shot" alt="sanitized frame">
      <img id="heat" alt="gpu heatmap" hidden>
      <div id="stageEmpty" class="empty">Open the demo page, then press <b>Perceive &amp; Redact</b>.</div>
    </div>

    <div class="metrics" id="metrics"></div>
    <div class="logWrap"><div class="logTitle">Agent trace</div><div id="log" class="log"></div></div>
  </div>

  <!-- --------------------------------------------------------------- masks -->
  <div class="panel" id="panel-masks">
    <div id="maskSummary" class="muted">Nothing redacted yet.</div>
    <table id="maskTable">
      <thead><tr><th>Token</th><th>Lens</th><th>What it was</th><th>Box (device px)</th><th>Proof</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- ---------------------------------------------------------------- wire -->
  <div class="panel" id="panel-wire">
    <div id="fwVerdict" class="verdict idle">Egress firewall has not run.</div>
    <div class="logTitle">Exact JSON handed to <code>transmit()</code></div>
    <pre id="wire" class="code">—</pre>
  </div>

  <!-- ------------------------------------------------------------ settings -->
  <div class="panel" id="panel-settings">
    <label>Planner endpoint
      <div class="inline">
        <input id="serverUrl" type="text" spellcheck="false">
        <button id="ping" class="ghost small">Ping</button>
      </div>
    </label>

    <label>Perception mode
      <select id="mode">
        <option value="dom-only">DOM only — Lens A, no GPU pass</option>
        <option value="balanced">Balanced — Lens A + Lens B on pixel surfaces</option>
        <option value="paranoid">Paranoid — mask every text-like region on screen</option>
      </select>
    </label>

    <label class="check"><input id="useGpu" type="checkbox"> Use WebGPU compute (off = CPU fallback path)</label>
    <label class="check"><input id="strictCapture" type="checkbox"> Strict capture via <code>tabCapture</code> — the worker never holds raw pixels</label>
    <label class="check"><input id="wantTileMap" type="checkbox"> Produce GPU heatmap (debug view)</label>

    <label>Lens&nbsp;B sensitivity <span id="thrVal" class="pill"></span>
      <input id="threshold" type="range" min="0.5" max="2.2" step="0.05">
      <span class="note">Lower = mask more aggressively. Raise it if logos or charts get masked.</span>
    </label>

    <div class="grid2">
      <label>Tile size
        <select id="tile"><option value="4">4 px</option><option value="8">8 px</option><option value="16">16 px</option></select>
      </label>
      <label>WebP quality
        <select id="quality"><option value="0.55">0.55</option><option value="0.72">0.72</option><option value="0.85">0.85</option></select>
      </label>
    </div>

    <label>Max agent steps <input id="maxSteps" type="number" min="1" max="30"></label>
    <div id="saveNote" class="note"></div>
  </div>
</main>
<script src="popup.js"></script>
</body>
